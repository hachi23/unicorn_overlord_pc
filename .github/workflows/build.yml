# Builds the release packages for every pull request and every merge to main:
#   Linux:   Unicorn-Overlord-x86_64.AppImage (built on Ubuntu 22.04: runs on glibc 2.35 and newer)
#   Windows: Unicorn-Overlord-PC-windows.zip (MSYS2 CLANG64; the program, _internal/, licenses)
# On main, the "latest" pre-release is replaced with the new files. A pushed vMAJOR.MINOR.PATCH tag
# publishes that release (notes: the tag's message); the start program offers it as an update
# (scripts/updates.py). Every release carries SHA256SUMS, which the updater checks.
# The job names (Linux, Windows) are the required status checks of the main branch protection.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GAME: unicorn
  TITLE: Unicorn Overlord
  # Pinned to the versions the port is developed with.
  VULKAN_HEADERS: v1.4.357
  GLSLANG: 16.0.0

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config nasm python3-venv python3-tk desktop-file-utils \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl-dev libgl-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libvulkan-dev mesa-vulkan-drivers \
            spirv-tools
          pip install --user 'cmake>=3.28'
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Cache the header libraries and the static dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/prefix
            out/deps
          key: linux-${{ env.VULKAN_HEADERS }}-${{ env.GLSLANG }}-${{ hashFiles('packaging/deps.sh') }}

      - name: Vulkan headers, glslang
        run: |
          prefix=$HOME/prefix
          if [ ! -f "$prefix/.done" ]; then
            build() {  # repo tag [cmake options]
              git clone -q --depth 1 --branch "$2" "https://github.com/$1" "src-${1##*/}"
              cmake -S "src-${1##*/}" -B "build-${1##*/}" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$prefix" "${@:3}"
              cmake --build "build-${1##*/}" --target install
            }
            build KhronosGroup/Vulkan-Headers "$VULKAN_HEADERS"
            build KhronosGroup/glslang "$GLSLANG" -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF
            touch "$prefix/.done"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include" >> "$GITHUB_ENV"

      - name: Package
        run: |
          # build.sh looks for SDL3 and FFmpeg through pkg-config before its --static branch:
          # build the static ones first (Ubuntu 22.04 has no SDL3 package).
          bash packaging/deps.sh
          export PKG_CONFIG_PATH=$PWD/out/deps/prefix/lib/pkgconfig:$PWD/out/deps/prefix/share/pkgconfig
          VW_VERSION=$(git describe --always --tags --match 'v[0-9]*') python3 packaging/package.py "$GAME"
          bash packaging/linux/appimage.sh "$TITLE"

      - name: Tests
        run: |
          export PKG_CONFIG_PATH=$PWD/out/deps/prefix/lib/pkgconfig:$PWD/out/deps/prefix/share/pkgconfig
          export CMAKE_PREFIX_PATH=$PWD/out/deps/prefix:$CMAKE_PREFIX_PATH
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          bash packaging/test-native.sh
          python3 -m unittest discover -s tests

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs
          path: |
            out/*.log
            out/deps/*.log

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*-source-*.tar.gz
            dist/*-linux-symbols-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit  # packaging needs the runner's python.org Python (py)

      - name: Cache the static dependencies
        uses: actions/cache@v6
        with:
          path: out/deps
          key: windows-${{ hashFiles('packaging/deps.sh') }}

      - name: Build and package
        run: VW_VERSION=$(git describe --always --tags --match 'v[0-9]*') bash packaging/windows/build.sh "$GAME"

      - name: Native and Python tests
        run: |
          bash packaging/test-native.sh
          py -3 -m unittest discover -s tests

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-logs
          path: |
            out/*.log
            out/deps/*.log

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*-windows.zip
            dist/*-windows-symbols-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7  # the tag's message: the release notes
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          cp artifacts/linux/*.AppImage artifacts/linux/*-source-*.tar.gz artifacts/linux/*-linux-symbols-*.tar.gz \
            artifacts/windows/*-windows.zip artifacts/windows/*-windows-symbols-*.tar.gz release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag \
            --title "$GITHUB_REF_NAME" release/*
      - name: Replace the "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Built from ${GITHUB_SHA} by the Build workflow. Test build: no game files included." \
            release/*
